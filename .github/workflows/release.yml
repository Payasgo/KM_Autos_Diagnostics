```yaml
name: Weekly release

# Prepares a release every Thursday night, so it is ready to open on Friday morning.
#
# It bumps the version on a branch, pushes it, and files an issue with the notes
# and a one-click link to open the pull request.
# It deliberately does NOT open the PR itself.
#
# 02:00 UTC Friday is 22:00 Thursday US Eastern during daylight saving.
# GitHub cron does not support timezones.

on:
  schedule:
    - cron: '0 2 * * 5'

  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major

# Only the permissions needed by this workflow.
permissions:
  contents: write
  issues: write

# Prevent overlapping release preparations.
concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      # Checkout master instead of the nonexistent main branch.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Find commits since the last release tag.
      - name: Check for unreleased commits
        id: unreleased
        shell: bash
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '')

          if [ -z "$LAST" ]; then
            echo "No release tag found; treating all commits as unreleased."
            COUNT=$(git rev-list --count HEAD)
          else
            COUNT=$(git rev-list --count "${LAST}..HEAD")
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

          echo "Last release: ${LAST:-none}"
          echo "Unreleased commits: $COUNT"

      # Stop when there is nothing to release.
      - name: Stop if there is nothing to release
        if: steps.unreleased.outputs.count == '0'
        run: |
          echo "::notice::No unreleased commits. Nothing to prepare."

      # Calculate the next version.
      - name: Bump the version on a branch
        if: steps.unreleased.outputs.count != '0'
        id: bump
        shell: bash
        run: |
          BUMP="${{ inputs.bump || 'minor' }}"

          npm version "$BUMP" --no-git-tag-version

          VERSION="v$(node -p "require('./package.json').version")"
          BRANCH="release/$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          echo "Preparing release: $VERSION"
          echo "Release branch: $BRANCH"

      # Verify that the package version was synchronized.
      - name: Verify the build version was synced
        if: steps.unreleased.outputs.count != '0'
        shell: bash
        run: |
          EXPECTED="${{ steps.bump.outputs.version }}"

          if ! grep -Fq "BUILD_VERSION = '$EXPECTED'" src/version.js; then
            echo "ERROR: src/version.js was not synced to $EXPECTED"
            exit 1
          fi

          echo "Build version verified: $EXPECTED"

      # Commit and push the release branch.
      - name: Commit and push
        if: steps.unreleased.outputs.count != '0'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          BRANCH="${{ steps.bump.outputs.branch }}"

          git switch -c "$BRANCH"

          git add package.json package-lock.json npm-shrinkwrap.json src/version.js 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ERROR: No version changes to commit."
            exit 1
          fi

          git commit -m "Release ${{ steps.bump.outputs.version }}"

          git push origin "$BRANCH"

      # Assemble release notes and the correct PR comparison URL.
      - name: Assemble the release notes
        if: steps.unreleased.outputs.count != '0'
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          LAST: ${{ steps.unreleased.outputs.last }}
          COUNT: ${{ steps.unreleased.outputs.count }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          COMPARE="${SERVER_URL}/${REPOSITORY}/compare/master...${BRANCH}?expand=1"

          echo "compare=$COMPARE" >> "$GITHUB_OUTPUT"

          {
            echo "\`$BRANCH\` is pushed and ready."
            echo
            echo "**$COUNT commits** since \`${LAST:-the beginning}\`."
            echo
            echo "**[Open the release pull request]($COMPARE)**"
            echo
            echo "After reviewing and merging, tag the merge commit:"
            echo
            echo '```bash'
            echo "git checkout master"
            echo "git pull origin master"
            echo "git tag $VERSION"
            echo "git push origin $VERSION"
            echo '```'
            echo
            echo "Merging the PR does not publish anything on its own."
            echo
            echo "## What is in this release"
            echo
            if [ -n "$LAST" ]; then
              git log --no-merges --pretty='- %s' "${LAST}..HEAD"
            else
              git log --no-merges --pretty='- %s' HEAD
            fi
          } > notes.md

          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # Create an issue containing the release notes.
      - name: File the release issue
        if: steps.unreleased.outputs.count != '0'
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ISSUE_URL=$(gh issue create \
            --title "Release ${{ steps.bump.outputs.version }} is ready to open" \
            --body-file notes.md)

          echo "$ISSUE_URL"
          echo "url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

      # Notify maintainers through Discord.
      - name: Ping maintainers
        if: steps.unreleased.outputs.count != '0'
        timeout-minutes: 5
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
          TITLE: Release ${{ steps.bump.outputs.version }} is ready to open
          URL: ${{ steps.notes.outputs.compare }}
          DESCRIPTION: |
            The release branch is pushed.
            Open the pull request, review and merge it, then tag the merge commit.
            Unreleased commits: ${{ steps.unreleased.outputs.count }}
            Notes and steps: ${{ steps.issue.outputs.url }}
          COLOR: '0x3498db'
        run: node scripts/discord-notify.js
```
