
name: Weekly release

# Prepare a release every Friday at 02:00 UTC.
# Push a release branch and create an issue with release notes.
# Pull requests are opened manually by maintainers.

on:
  schedule:
    - cron: '0 2 * * 5'

  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Check for unreleased commits
        id: unreleased
        shell: bash
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)

          if [ -z "$LAST" ]; then
            COUNT=$(git rev-list --count HEAD)
          else
            COUNT=$(git rev-list --count "${LAST}..HEAD")
          fi

          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          echo "Last release: ${LAST:-none}"
          echo "Unreleased commits: $COUNT"

      - name: Stop if there is nothing to release
        if: steps.unreleased.outputs.count == '0'
        run: |
          echo "::notice::No new commits. Nothing to release."

      - name: Bump the version
        if: steps.unreleased.outputs.count != '0'
        id: bump
        shell: bash
        run: |
          BUMP="${{ inputs.bump || 'minor' }}"

          npm version "$BUMP" --no-git-tag-version

          VERSION="v$(node -p "require('./package.json').version")"
          BRANCH="release/$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          echo "New version: $VERSION"
          echo "Release branch: $BRANCH"

      - name: Verify build version
        if: steps.unreleased.outputs.count != '0'
        shell: bash
        run: |
          EXPECTED="${{ steps.bump.outputs.version }}"

          if ! grep -Fq "BUILD_VERSION = '$EXPECTED'" src/version.js; then
            echo "::error::src/version.js was not updated to $EXPECTED"
            exit 1
          fi

          echo "Build version verified."

      - name: Commit and push release branch
        if: steps.unreleased.outputs.count != '0'
        shell: bash
        run: |
          BRANCH="${{ steps.bump.outputs.branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Remote branch $BRANCH already exists. Check the previous release."
            exit 1
          fi

          git switch -c "$BRANCH"

          git add -u

          if git diff --cached --quiet; then
            echo "::error::No version changes were staged."
            exit 1
          fi

          git commit -m "Release ${{ steps.bump.outputs.version }}"

          git push origin "$BRANCH"

      - name: Assemble release notes
        if: steps.unreleased.outputs.count != '0'
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          LAST: ${{ steps.unreleased.outputs.last }}
          COUNT: ${{ steps.unreleased.outputs.count }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          COMPARE="${SERVER_URL}/${REPOSITORY}/compare/master...${BRANCH}?expand=1"

          echo "compare=$COMPARE" >> "$GITHUB_OUTPUT"

          {
            echo "\`$BRANCH\` is pushed and ready."
            echo
            echo "**$COUNT commits** since \`${LAST:-the beginning}\`."
            echo
            echo "**[Open the release pull request]($COMPARE)**"
            echo
            echo "Review and merge the PR, then tag the merge commit:"
            echo
            echo '```bash'
            echo "git checkout master"
            echo "git pull origin master"
            echo "git tag $VERSION"
            echo "git push origin $VERSION"
            echo '```'
            echo
            echo "Merging the PR does not publish anything on its own."
            echo
            echo "## Release contents"
            echo

            if [ -n "$LAST" ]; then
              git log --no-merges --pretty='- %s' "${LAST}..HEAD"
            else
              git log --no-merges --pretty='- %s' HEAD
            fi
          } > notes.md

          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release issue
        if: steps.unreleased.outputs.count != '0'
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ISSUE_URL=$(gh issue create \
            --title "Release ${{ steps.bump.outputs.version }} is ready to open" \
            --body-file notes.md)

          echo "$ISSUE_URL"
          echo "url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

      - name: Notify maintainers on Discord
        if: steps.unreleased.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 5
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
          TITLE: Release ${{ steps.bump.outputs.version }} is ready to open
          URL: ${{ steps.notes.outputs.compare }}
          DESCRIPTION: |
            The release branch is pushed.
            Open the pull request, review and merge it, then tag the merge commit.
            Unreleased commits: ${{ steps.unreleased.outputs.count }}
            Notes and steps: ${{ steps.issue.outputs.url }}
          COLOR: '0x3498db'
        run: node scripts/discord-notify.js
